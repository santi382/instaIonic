<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/feed"></ion-back-button>
    </ion-buttons>
    <ion-title>Nueva publicación</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div style="padding:16px;background:white;min-height:100vh;max-width:600px;margin:0 auto;">

    <!-- Preview imagen -->
    <div style="width:100%;aspect-ratio:1;background:#f0f0f0;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:16px;border:2px dashed #ccc;">
      <img *ngIf="preview" [src]="preview" style="width:100%;height:100%;object-fit:cover;" />
      <div *ngIf="!preview" style="text-align:center;color:#888;">
        <div style="font-size:48px;">📷</div>
        <p style="margin:8px 0 0;font-size:14px;color:#888;">Selecciona o toma una foto</p>
      </div>
    </div>

    <input #fileInput type="file" accept="image/*" hidden (change)="onFileChange($event)" />

    <!-- Botones foto -->
    <div style="display:flex;gap:10px;margin-bottom:16px;">
      <button (click)="takePhoto()"
              style="flex:1;padding:12px;background:#f0f4ff;color:#0d2d5e;border:1.5px solid #0d2d5e;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">
        📷 Usar cámara
      </button>
      <button (click)="fileInput.click()"
              style="flex:1;padding:12px;background:#f0f4ff;color:#0d2d5e;border:1.5px solid #0d2d5e;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">
        🖼️ Galería
      </button>
    </div>

    <!-- Caption -->
    <div style="margin-bottom:16px;">
      <textarea [(ngModel)]="caption"
                placeholder="Escribe una descripción..."
                rows="3"
                style="width:100%;padding:12px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:14px;outline:none;box-sizing:border-box;resize:none;font-family:inherit;background:white;color:#111;">
      </textarea>
    </div>

    <!-- Botón publicar -->
    <button (click)="upload()" [disabled]="!file"
            [style.opacity]="!file ? '0.5' : '1'"
            style="width:100%;padding:14px;background:linear-gradient(135deg,#0a1628,#0d2d5e);color:white;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;">
      Publicar
    </button>

  </div>
</ion-content>
